<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Patient Management</title>


    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- =====================================================
         BOOTSTRAP ICONS
    ====================================================== -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">


    <!-- =====================================================
         INTER FONT
    ====================================================== -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">


    <!-- =====================================================
         FONTISTO
    ====================================================== -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/fontisto@3.0.4/css/fontisto/fontisto.min.css">


    <!-- =====================================================
         GLOBAL APPLICATION CSS
    ====================================================== -->

    <link rel="stylesheet" th:href="@{/css/common.css}">

    <!-- =====================================================
         PAGE-SPECIFIC CSS
         Child pages can override this fragment.
    ====================================================== -->

    <th:block layout:fragment="pageCss"></th:block>

</head>


<body>

<div id="app">


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>


    <div class="main-wrapper">


        <!-- =================================================
             HEADER
        ================================================== -->

        <div th:replace="~{fragments/header :: header}"></div>


        <!-- =================================================
             PAGE CONTENT
        ================================================== -->

        <div class="page-content">

            <div layout:fragment="content"></div>

        </div>

        <div layout:fragment="footer">
        </div>

    </div>

</div>


<!-- =====================================================
     GLOBAL JAVASCRIPT
====================================================== -->

<script>

    function toggleSidebar() {

        document
            .getElementById("app")
            .classList
            .toggle("sidebar-collapsed");


        if ($("#toggleIcon").hasClass("bi-chevron-right")) {

            $("#toggleIcon")
                .removeClass("bi-chevron-right")
                .addClass("bi-chevron-left");

        } else {

            $("#toggleIcon")
                .removeClass("bi-chevron-left")
                .addClass("bi-chevron-right");

        }

    }


    function toggleTheme() {

        document
            .body
            .classList
            .toggle("dark-mode");


        localStorage.setItem(
            "theme",
            document
                .body
                .classList
                .contains("dark-mode")
                ? "dark"
                : "light"
        );

    }


    document.addEventListener(
        "DOMContentLoaded",
        function () {

            if (
                localStorage.getItem("theme")
                === "dark"
            ) {

                document
                    .body
                    .classList
                    .add("dark-mode");

            }

        }
    );

</script>


<!-- =====================================================
     JQUERY
====================================================== -->

<script
        src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
        crossorigin="anonymous">
</script>


<!-- =====================================================
     PAGE-SPECIFIC JAVASCRIPT
     Child pages can override this fragment.
====================================================== -->

<th:block layout:fragment="pageJs"></th:block>


</body>

</html>
