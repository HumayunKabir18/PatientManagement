<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/master}">

<body>

<div layout:fragment="content">

    <div class="row">

        <!-- PATIENT INFORMATION -->
        <div class="col-lg-9">

            <div th:replace="~{patient/patientRegistration :: patientForm}">
            </div>

        </div>

        <!-- PATIENT SUMMARY -->
        <div class="col-lg-3">

            <div class="summary-card sticky-sidebar">

                <h5 class="fw-bold mb-4">
                    Patient Summary
                </h5>

                <!-- Patient ID -->
                <div class="summary-item">

                    <small class="text-secondary">
                        Patient ID
                    </small>

                    <div class="fw-semibold"
                         th:text="${patient.patientCode}">
                    </div>

                </div>

                <!-- Last Visit -->
                <div class="summary-item">

                    <small class="text-secondary">
                        Last Visit
                    </small>

                    <div class="fw-semibold">
                        12 May 2026
                    </div>

                </div>

                <!-- Blood Group -->
                <div class="summary-item">

                    <small class="text-secondary">
                        Blood Group
                    </small>

                    <div class="fw-semibold text-danger"
                         th:text="${patient.bloodGroup}">
                    </div>

                </div>

                <!-- Allergy Alert -->
                <div class="summary-item">

                    <small class="text-secondary">
                        Allergy Alert
                    </small>

                    <div class="fw-semibold text-warning">

                        <span th:if="${patient.allergy}">
                            Allergy
                        </span>

                        <span th:unless="${patient.allergy}">
                            No known allergy
                        </span>

                    </div>

                </div>

                <!-- Payment Status -->
                <div class="summary-item">

                    <small class="text-secondary">
                        Payment Status
                    </small>

                    <div class="badge bg-success">
                        Paid
                    </div>

                </div>

                <hr>

                <!-- Recent Visits -->
                <h6 class="fw-bold mb-3">
                    Recent Visits
                </h6>

                <div class="timeline">

                    <div class="timeline-item">

                        <small>
                            May 2026
                        </small>

                        <div class="fw-semibold">
                            Fever Treatment
                        </div>

                    </div>

                    <div class="timeline-item">

                        <small>
                            Jan 2026
                        </small>

                        <div class="fw-semibold">
                            Blood Test
                        </div>

                    </div>

                    <div class="timeline-item">

                        <small>
                            2025
                        </small>

                        <div class="fw-semibold">
                            Follow-up
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
