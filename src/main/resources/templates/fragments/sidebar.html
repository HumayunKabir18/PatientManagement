<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="sidebar">

    <aside class="sidebar main-card">

        <!-- HEADER -->
        <div class="sidebar-header">

            <div class="logo-box">
                <i class="bi bi-heart-pulse-fill"></i>
            </div>

            <!-- TEXT WRAPPER (IMPORTANT FOR COLLAPSE) -->
            <div class="sidebar-title">
                <h5 class="mb-0 fw-bold">AraggoNiketon</h5>
                <small>Dr. Ziaur Rahman</small>
            </div>

        </div>

        <!-- MENU -->
        <ul class="sidebar-menu">

            <li>
                <a th:href="@{/dashboard}">
                    <i class="bi bi-speedometer2"></i>
                    <span class="menu-text">Dashboard</span>
                </a>
            </li>

            <li>
                <a th:href="@{/patients/list}">
                    <i class="bi bi-people-fill"></i>
                    <span class="menu-text">Patients</span>
                </a>
            </li>

        </ul>
        <!-- TOGGLE BUTTON AT BOTTOM -->
        <div class="sidebar-toggle-wrapper">
            <button id="sidebarToggleBtn" class="btn-toggle" aria-label="Toggle sidebar"  onclick="toggleSidebar()">
                <i class="bi bi-chevron-left" id="toggleIcon"></i>
            </button>
        </div>
    </aside>

</div>

</body>
</html>
